name: Build Winter Chess

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'integration_test/**'
      - 'test_driver/**'
      - '.github/workflows/screens.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared CI tools (winter-hub/ci)
        uses: actions/checkout@v4
        with:
          repository: Wateroflord/winter-hub
          path: .winter
          sparse-checkout: /ci/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: |
          flutter create --project-name winter_chess --org com.winterhub --platforms android .
          rm -f test/widget_test.dart
          python3 tools/patch_android.py
          flutter pub get
          dart run flutter_launcher_icons || true
      - name: Stockfish for Android (arm64)
        run: |
          names=$(gh release view -R official-stockfish/Stockfish --json assets -q '.assets[].name')
          echo "::warning title=sf-assets::$(echo $names | tr '\n' ' ')"
          f=$(echo "$names" | grep -E '^stockfish-android-(arm64|armv8)' | grep -v dotprod | head -1)
          echo "asset: $f"
          mkdir -p sf && gh release download -R official-stockfish/Stockfish -p "$f" -D sf
          cd sf && { tar -xf "$f" 2>/dev/null || unzip -q "$f"; } && cd ..
          bin=$(find sf -type f -name 'stockfish*' ! -name '*.tar*' ! -name '*.zip' ! -name '*.txt' ! -name '*.md' -size +1M | head -1)
          echo "engine: $bin"; ls -la "$bin"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$bin" android/app/src/main/jniLibs/arm64-v8a/libstockfish.so
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Analyze
        run: |
          rc=0
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || rc=$?
          cat analyze.txt
          python3 .winter/ci/annotate.py analyze.txt "analyze"
          exit $rc
      - name: Tests
        run: |
          set -o pipefail
          if ls test/*_test.dart >/dev/null 2>&1; then
            flutter test test 2>&1 | tee test.txt || { python3 .winter/ci/annotate.py test.txt "tests"; exit 1; }
          else
            echo "Тестов нет"
          fi
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} 2>&1 | tee build.txt || { python3 .winter/ci/annotate.py build.txt "build"; exit 1; }
      - name: Sign APK
        env:
          WINTER_SIGNING: ${{ secrets.WINTER_SIGNING }}
        run: python3 .winter/ci/sign_apk.py build/app/outputs/flutter-apk/app-release.apk
      - name: Release
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Winter-Chess.apk
          gh release create "build-${{ github.run_number }}" Winter-Chess.apk \
            --title "Шахматы, сборка ${{ github.run_number }}" \
            --notes "Телефон: Winter-Chess.apk. ПК: Winter-Chess-Setup.exe (появится через несколько минут). Удобнее ставить через Winter Hub." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared CI tools (winter-hub/ci)
        uses: actions/checkout@v4
        with:
          repository: Wateroflord/winter-hub
          path: .winter
          sparse-checkout: /ci/
          sparse-checkout-cone-mode: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Windows project
        shell: bash
        run: |
          flutter create --project-name winter_chess --org com.winterhub --platforms windows .
          rm -f test/widget_test.dart
          python tools/patch_windows.py
          flutter pub get
          dart run flutter_launcher_icons -f icons_windows.yaml || true
          sed -i 's/L"winter_chess"/L"Winter Chess"/' windows/runner/main.cpp || true
      - name: Build Windows app
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} 2>&1 | tee build.txt || { python3 .winter/ci/annotate.py build.txt "windows"; exit 1; }
      - name: Stockfish for Windows
        shell: bash
        run: |
          names=$(gh release view -R official-stockfish/Stockfish --json assets -q '.assets[].name')
          f=$(echo "$names" | grep -E '^stockfish-windows-x86-64' | head -1)
          echo "asset: $f"
          mkdir -p sf && gh release download -R official-stockfish/Stockfish -p "$f" -D sf
          cd sf && { unzip -q "$f" 2>/dev/null || tar -xf "$f"; } && cd ..
          bin=$(find sf -type f -name 'stockfish*.exe' -size +1M | head -1)
          echo "engine: $bin"
          cp "$bin" build/windows/x64/runner/Release/stockfish.exe
          lic=$(find sf -iname 'copying*' | head -1); [ -n "$lic" ] && cp "$lic" build/windows/x64/runner/Release/Stockfish-LICENSE.txt || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build installer
        shell: pwsh
        env:
          BUILD_NO: ${{ github.run_number }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc tools\installer.iss
          if ($LASTEXITCODE -ne 0) { echo "::error title=installer::Inno Setup failed"; exit 1 }
      - name: Attach to the release
        shell: pwsh
        run: |
          gh release upload "build-${{ github.run_number }}" dist/Winter-Chess-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
