name: Build Winter Chess

on:
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: |
          flutter create --project-name winter_chess --org com.winterhub --platforms android .
          rm -rf test
          python3 tools/patch_android.py
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore
          flutter pub get
          dart run flutter_launcher_icons || true
      - name: Stockfish for Android (arm64)
        run: |
          gh release download -R official-stockfish/Stockfish -p 'stockfish-android-armv8.tar' -D sf
          tar -xf sf/stockfish-android-armv8.tar -C sf
          bin=$(find sf -type f -name 'stockfish-android-armv8*' ! -name '*.tar' | head -1)
          echo "engine: $bin"; ls -la "$bin"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$bin" android/app/src/main/jniLibs/arm64-v8a/libstockfish.so
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          python3 tools/annotate.py analyze.txt "analyze"
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} 2>&1 | tee build.txt || { python3 tools/annotate.py build.txt "build"; exit 1; }
      - name: Release
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Winter-Chess.apk
          gh release create "build-${{ github.run_number }}" Winter-Chess.apk \
            --title "Шахматы, сборка ${{ github.run_number }}" \
            --notes "Телефон: Winter-Chess.apk. ПК: Winter-Chess-Setup.exe (появится через несколько минут). Удобнее ставить через Winter Hub." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Windows project
        shell: bash
        run: |
          flutter create --project-name winter_chess --org com.winterhub --platforms windows .
          rm -rf test
          python tools/patch_windows.py
          flutter pub get
          dart run flutter_launcher_icons || true
          sed -i 's/L"winter_chess"/L"Winter Chess"/' windows/runner/main.cpp || true
      - name: Build Windows app
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} 2>&1 | tee build.txt || { python3 tools/annotate.py build.txt "windows"; exit 1; }
      - name: Stockfish for Windows
        shell: bash
        run: |
          gh release download -R official-stockfish/Stockfish -p 'stockfish-windows-x86-64-avx2.zip' -D sf
          cd sf && unzip -q stockfish-windows-x86-64-avx2.zip && cd ..
          bin=$(find sf -type f -name 'stockfish*.exe' | head -1)
          echo "engine: $bin"
          cp "$bin" build/windows/x64/runner/Release/stockfish.exe
          cp sf/stockfish/Copying.txt build/windows/x64/runner/Release/Stockfish-LICENSE.txt 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build installer
        shell: pwsh
        env:
          BUILD_NO: ${{ github.run_number }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc tools\installer.iss
          if ($LASTEXITCODE -ne 0) { echo "::error title=installer::Inno Setup failed"; exit 1 }
      - name: Attach to the release
        shell: pwsh
        run: |
          gh release upload "build-${{ github.run_number }}" dist/Winter-Chess-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
