name: Make puzzles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  puzzles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Lichess puzzles and pick a set
        run: |
          pip install zstandard
          curl -sSL -o puzzles.csv.zst https://database.lichess.org/lichess_db_puzzle.csv.zst
          python3 tools/make_puzzles.py puzzles.csv.zst
      - name: Commit
        run: |
          git config user.name "winter-chess-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/puzzles.json
          git commit -m "Puzzles from the Lichess database" || exit 0
          git push
